<section>
<h2>اليوم 1: طلبات المشاركة والاستخدام الثانوي</h2>
<ol>
<li><p>شركة استشارية خاصة متعاقدة مع جهة حكومية تطلب بيانات مصنفة «سري» عن مواقع تخزين المواد الخطرة، لغرض تقر الجهة بأنه مشروع، وبالحد الأدنى. من يوقّع الاتفاقية عن الجهة؟</p><ul><li><b>أ.</b> مدير مكتب إدارة البيانات في الجهة</li><li><b>ب.</b> المسؤول الأول في الجهة أو من يفوضه</li><li><b>ج.</b> لا أحد، فالطلب يكفيه نموذج ضوابط المشاركة</li><li><b>د.</b> الممثل النظامي للشركة الطالبة وحده</li></ul></li>
<li><p>متعاقد يبني لوحة حضور مراكز التدريب بموجب اتفاقية لا تذكر أي طرف ثالث. بعد شهرين يكتب: «شركتنا الشقيقة تحتاج البيانات نفسها لمشروع آخر، ونحن نتحمل المسؤولية.» ما القرار؟</p><ul><li><b>أ.</b> موافقة، لأن المتعاقد يتحمل المسؤولية كتابيًا</li><li><b>ب.</b> ملحق للاتفاقية يضيف الشركة الشقيقة طرفًا ثالثًا</li><li><b>ج.</b> إنهاء الاتفاقية الحالية فورًا لأن المتعاقد طلب ما لا تسمح به</li><li><b>د.</b> رفض ضمن الاتفاقية الحالية، وللشركة أن تقدم طلبها بغرضها</li></ul></li>
<li><p>باحثة جامعية، عبر جامعتها وبموافقة لجنة الأخلاقيات، تسأل: هل زادت شكاوى الإجهاد الحراري في يوليو عن يونيو في كل منطقة خلال خمس سنوات؟ أي مسار يكفيها؟</p><ul><li><b>أ.</b> جداول مجمّعة تعدها الهيئة</li><li><b>ب.</b> بيئة البحث الآمنة بكل سجلات الشكاوى</li><li><b>ج.</b> مستخرج منزوع الهوية برخصة استخدام</li><li><b>د.</b> السجلات كاملة، لأن الموافقة الأكاديمية موجودة</li></ul></li>
<li><p>جهة حكومية تطلب من هيئة صِيان سجلات شكاوى الإجهاد الحراري مربوطة بزيارات التفتيش، لتقدير أثر تمديد حظر العمل الصيفي، وهو غرض للمصلحة العامة ضمن اختصاصها. أي إجراء يحكم الطلب؟</p><ul><li><b>أ.</b> رخصة استخدام من الهيئة كما في طلبات الجهات الخاصة</li><li><b>ب.</b> رفض، لأن السجلات مرتبطة على مستوى المنشأة</li><li><b>ج.</b> إجراءات سياسة المشاركة ومهلها، عبر سوق البيانات</li><li><b>د.</b> مسار طلبات المعلومات العامة ومهلته ثلاثون يومًا</li></ul></li>
<li><p>جهة حكومية تطلب بيانات مصنفة «مقيد» عن مراكز التدريب المعتمدة، بغرض ضمن اختصاصها وبالحد الأدنى. ما الأداة ومن يوقّعها عن الجهة المشاركة؟</p><ul><li><b>أ.</b> اتفاقية مشاركة بيانات يوقّعها المسؤول الأول</li><li><b>ب.</b> نموذج ضوابط المشاركة يوقّعه مدير مكتب إدارة البيانات</li><li><b>ج.</b> اتفاقية مشاركة بيانات يوقّعها مدير مكتب إدارة البيانات</li><li><b>د.</b> لا أداة، فالطلب بين جهتين حكوميتين</li></ul></li>
<li><p>شركة خاصة تطلب إحصاءات الإصابات الشهرية بحسب المنطقة، وهي مصنفة «عام» ومنشورة في منصة البيانات المفتوحة. وأرفقت مسودة اتفاقية. ما الرد؟</p><ul><li><b>أ.</b> تُراجع الاتفاقية ويوقّعها مدير مكتب إدارة البيانات</li><li><b>ب.</b> يُطلب منها بيان الغرض قبل أي رد</li><li><b>ج.</b> تُدل على المجموعة في منصة البيانات المفتوحة</li><li><b>د.</b> تُرفض لأن الطالب جهة خاصة</li></ul></li>
<li><p>تطلب جهة حكومية من الهيئة بيانات الملاك في السجل التجاري للمنشآت. مصدرها جهة أخرى لم تفوّض الهيئة، والطلب بلا موافقة منها. ما الخطوة؟</p><ul><li><b>أ.</b> إشعار الطالب خلال 5 أيام عمل ليحصل على موافقة الجهة المصدر</li><li><b>ب.</b> المشاركة من نسخة الهيئة، فهي أسرع وتُحدَّث كل أسبوع من المصدر</li><li><b>ج.</b> رفض نهائي لأن الهيئة ليست المصدر</li><li><b>د.</b> طلب الموافقة من الجهة المصدر بعد المشاركة</li></ul></li>
<li><p>جهة حكومية تطلب من الهيئة سجلات إصابات خمس سنوات لدراسة تحليلية تُنشر نتائجها مجمّعة، والبيانات نفسها تُرسل دوريًا إلى بنك البيانات الوطني. إلى أين يتجه الطلب أولًا؟</p><ul><li><b>أ.</b> قناة التكامل الحكومية مباشرة</li><li><b>ب.</b> مسار طلبات المعلومات العامة</li><li><b>ج.</b> بيئة البحث الآمنة في الهيئة</li><li><b>د.</b> بنك البيانات الوطني</li></ul></li>
<li><p>في اتفاقية مع متعاقد يبني لوحة لمراكز التدريب، ذكر المتعاقد أنه سيستعمل بيانات الحضور «لتحسين نماذجنا الذكية». أي بند يحسم ذلك؟</p><ul><li><b>أ.</b> بند الأشخاص المخولين</li><li><b>ب.</b> بند وسيلة المشاركة</li><li><b>ج.</b> بند قيود الاستخدام والاستخدام اللاحق</li><li><b>د.</b> بند الإبلاغ عن تسرب البيانات</li></ul></li>
<li><p>باحث في جامعة يرسل طلب بيانات لدراسة من بريده الشخصي، دون خطاب من جامعته. الغرض بحثي ومفيد. ما الخطوة الأولى؟</p><ul><li><b>أ.</b> الموافقة بشروط لأن الغرض بحثي</li><li><b>ب.</b> الرفض لأن الطلب شخصي</li><li><b>ج.</b> إحالته إلى مسار طلبات المعلومات</li><li><b>د.</b> تقديمه عبر جامعته بموافقتها المكتوبة</li></ul></li>
<li><p>شركة خاصة تطلب سجلات فردية لتطوير منتج تبيعه للمقاولين، وتسمي ذلك «ابتكارًا يخدم السلامة». هل يدخل الطلب في الاستخدام الثانوي للبحث والتطوير والابتكار؟</p><ul><li><b>أ.</b> نعم، فالابتكار من أغراض القواعد، والمنتج يخدم السلامة</li><li><b>ب.</b> نعم، إن حذفت الشركة الأسماء</li><li><b>ج.</b> لا، فالأغراض الربحية مستثناة صراحة</li><li><b>د.</b> لا، فالقواعد للجهات الحكومية وحدها</li></ul></li>
<li><p>استبدلت الجهة رقم السجل التجاري بمفتاح مستعار في جدولي الشكاوى وزيارات التفتيش، ليربط الباحث بينهما. ما وصف البيانات الناتجة؟</p><ul><li><b>أ.</b> بيانات مجهولة يجوز نشرها</li><li><b>ب.</b> بيانات مستعارة مرتبطة ما زالت تخص منشآت وأفرادًا</li><li><b>ج.</b> بيانات عامة لأن الرقم الأصلي أُزيل</li><li><b>د.</b> بيانات مجمّعة لأن المفتاح لا يعني شيئًا خارج الجهة</li></ul></li>
<li><p>تطلب باحثة إخراج جدول من بيئة البحث الآمنة، فيه خلية واحدة بثلاث شكاوى، والحد في الجهة عشرة. ما الإجراء؟</p><ul><li><b>أ.</b> إخراج الجدول كما هو، فالجدول مجمّع</li><li><b>ب.</b> إخراجه مع تنبيه مكتوب للباحثة بألا تنشر الخلية الصغيرة</li><li><b>ج.</b> منع الجدول كله</li><li><b>د.</b> دمج الخلية مع غيرها أو حجبها، ثم الإخراج</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: البيانات المفتوحة وحرية المعلومات</h2>
<ol>
<li><p>ملف من 400 سجل، فيه 25 فئة تكافؤ على الأعمدة شبه المباشرة، وأصغرها 4 سجلات. ما أعلى خطر وما متوسط الخطر؟</p><ul><li><b>أ.</b> أعلى خطر 0.0625، ومتوسطه 0.01</li><li><b>ب.</b> أعلى خطر 0.25، ومتوسطه 0.25</li><li><b>ج.</b> أعلى خطر 0.25، ومتوسطه 0.0625</li><li><b>د.</b> أعلى خطر 0.0625، ومتوسطه 0.25</li></ul></li>
<li><p>تنشر الهيئة جدولين مصنفين «عام»: شكاوى الإجهاد الحراري بحسب المنطقة والقطاع، وبحسب المنطقة والجنسية. ويريد فريق التقارير نشر جدول بالمنطقة والقطاع والجنسية معًا. ما الخطوة قبل النشر؟</p><ul><li><b>أ.</b> نشره كما هو، فالجدولان اللذان يجمعهما منشوران</li><li><b>ب.</b> فحص خلاياه الصغيرة، فالجمع قد يرفع المستوى</li><li><b>ج.</b> رفضه، فثلاثة أبعاد لا تُنشر مفتوحة</li><li><b>د.</b> نشره بترخيص يمنع الاستخدام التجاري</li></ul></li>
<li><p>فرد يطلب عدد مستشاري السلامة المرخصين في كل منطقة. قبل أن يقرر الموظف، كتب إليه: «اذكر صفتك والغرض من طلبك». ما تقويم ذلك؟</p><ul><li><b>أ.</b> خطأ: لا يُشترط في الطالب صفة ولا مصلحة</li><li><b>ب.</b> صحيح: الغرض المشروع شرط في كل طلب بيانات</li><li><b>ج.</b> صحيح: الجهة تتحقق من هوية الطالب وصفته قبل الإتاحة</li><li><b>د.</b> خطأ في هذا الطلب فقط، لأن المعلومات قليلة</li></ul></li>
<li><p>وصل طلب معلومات يوم الأحد 2026-03-01، ويحتاج فرز آلاف الصفحات. وفق قاعدة الحالة، متى يُرسل إشعار التمديد، وما أبعد تاريخ جديد يجوز فيه؟</p><ul><li><b>أ.</b> قبل 2026-04-12، والتاريخ الجديد حتى 2026-05-12</li><li><b>ب.</b> بعد 2026-03-31، والتاريخ الجديد حتى 2026-04-30</li><li><b>ج.</b> لا إشعار، ويكفي أن يصدر القرار قبل 2026-04-30</li><li><b>د.</b> حتى 2026-03-31، والتاريخ الجديد حتى 2026-04-30</li></ul></li>
<li><p>في سجل باب حرية المعلومات لشهرين 40 قرارًا: 20 موافقة، و6 موافقة جزئية، و8 رفض، و4 إشعار، و2 تمديد. ما نسبة الموافقة بتعريف الحالة؟</p><ul><li><b>أ.</b> 65.0%</li><li><b>ب.</b> 58.8%</li><li><b>ج.</b> 76.5%</li><li><b>د.</b> 50.0%</li></ul></li>
<li><p>ملف إحصاءات مراكز التدريب فيه: رقم شهادة المتدرب الصادر من الهيئة، والمدينة، والعمر، والجنس، ونتيجة الاختبار. ما رقم الشهادة؟</p><ul><li><b>أ.</b> معرّف إداري يربط بسجلات الهيئة</li><li><b>ب.</b> عمود وصفي لا يدل على أحد</li><li><b>ج.</b> معرِّف شبه مباشر يكفي أن يُعمَّم في فئات</li><li><b>د.</b> النتيجة التي يُنشر الملف من أجلها</li></ul></li>
<li><p>بعد معالجة ملف من 2000 سجل، صار فيه 80 فئة تكافؤ أصغرها 5 سجلات، وحُذف 60 سجلًا من الأصل. أي معيار من معايير الحالة لم يتحقق؟</p><ul><li><b>أ.</b> k، لأن أصغر فئة 5 والمعيار أكثر من 5</li><li><b>ب.</b> أعلى خطر، لأنه 0.2</li><li><b>ج.</b> متوسط الخطر، لأنه 0.04</li><li><b>د.</b> لا شيء: كلها في الحدود</li></ul></li>
<li><p>ملف منشور بلغ k = 5، وفيه فئة من سبعة سجلات كلها نتيجتها «إصابة مميتة». ما الخطر الذي بقي؟</p><ul><li><b>أ.</b> لا خطر، فالفئة أكبر من k</li><li><b>ب.</b> تُعرف نتيجتهم دون تحديد سجلاتهم</li><li><b>ج.</b> خطر الربط بالرقم الإداري</li><li><b>د.</b> خطر أن يُعاد نشر الملف بترخيص آخر</li></ul></li>
<li><p>جدول منشور بعدد المتدربين في كل مركز تدريب في منطقة، ومعه المجموع. خلية واحدة فيه 3، والحد في الجهة عشرة. ما الذي يكفي؟</p><ul><li><b>أ.</b> حجب الخلية الصغيرة وحدها، وإبقاء المجموع كما هو</li><li><b>ب.</b> حذف الجدول كله من النشر</li><li><b>ج.</b> حجب الخلية مع خلية أخرى، أو حذف المجموع</li><li><b>د.</b> نشره بملاحظة أن الأعداد الصغيرة تقريبية</li></ul></li>
<li><p>يطلب فرد قائمة مراكز التدريب المعتمدة، وهي منشورة على موقع الهيئة. ما القرار؟</p><ul><li><b>أ.</b> إشعار بمكانها على الموقع، وبحق التظلم</li><li><b>ب.</b> موافقة، ويُرسل إليه ملف القائمة</li><li><b>ج.</b> رفض، فالمعلومات منشورة ولا حاجة إلى طلب</li><li><b>د.</b> إحالة الطلب إلى مسار مشاركة البيانات</li></ul></li>
<li><p>يطلب صحفي محضر لجنة يوصي بتعديل اشتراطات السلامة في المصانع، والقرار لم يصدر بعد. أي فئة تنطبق؟</p><ul><li><b>أ.</b> الفئة 4: التحقيق والتفتيش</li><li><b>ب.</b> الفئة 5: التوصيات لقرار لم يصدر</li><li><b>ج.</b> الفئة 8: المنافسات والمناقصات والعروض</li><li><b>د.</b> الفئة 9: المقيد بنظام آخر</li></ul></li>
<li><p>صدر قرار رفض ووصل إلى الطالب يوم الأحد 2026-05-03. ما آخر يوم له ليتظلم وفق قاعدة الحالة؟</p><ul><li><b>أ.</b> 2026-05-13</li><li><b>ب.</b> 2026-06-02</li><li><b>ج.</b> 2026-05-14</li><li><b>د.</b> 2026-05-17</li></ul></li>
<li><p>عقد صيانة يطلبه فرد، فيه نطاق العمل والمدة والقيمة الإجمالية، وجدول بأسعار الوحدات يكشف إفصاحه ميزة تجارية للمورد. ما القرار؟</p><ul><li><b>أ.</b> رفض، فالعقد فيه معلومات تجارية</li><li><b>ب.</b> موافقة على العقد كله، فالعقود الحكومية وأسعارها معلومات عامة</li><li><b>ج.</b> موافقة جزئية: يُتاح العقد ويُحجب جدول الأسعار بالفئة 6</li><li><b>د.</b> تمديد حتى يوافق المورد على الإفصاح</li></ul></li>
<li><p>في سجل الطلبات طلب استلم قبل خمسين يومًا ولم يصدر فيه قرار حتى نهاية الفترة، ومهلته ثلاثون يومًا. كيف يُعامل في مؤشر القرارات في المهلة بتعريف الحالة؟</p><ul><li><b>أ.</b> يُعدّ متأخرًا</li><li><b>ب.</b> يُستبعد لأنه بلا قرار</li><li><b>ج.</b> يُعدّ في المهلة حتى يصدر القرار</li><li><b>د.</b> يُنقل إلى الفترة التالية</li></ul></li>
<li><p>ارتفع متوسط التنزيل الشهري لمجموعة منشورة من 200 إلى 500. ماذا يقول ذلك؟</p><ul><li><b>أ.</b> أن حالات إعادة استخدام المجموعة زادت بالنسبة نفسها</li><li><b>ب.</b> أن الطلب عليها زاد، لا من استفاد ولا كيف</li><li><b>ج.</b> أن جودة المجموعة تحسنت</li><li><b>د.</b> أن على الهيئة نشر المجموعة بصيغ أخرى</li></ul></li>
<li><p>أي إجراء تحسين مكتوب كما تطلبه مهمة المتابعة؟</p><ul><li><b>أ.</b> مسؤول البيانات المفتوحة يحسّن زمن الاستجابة لطلبات المعلومات خلال العام</li><li><b>ب.</b> مسؤول البيانات المفتوحة ينشر المجموعتين الباقيتين قبل 2027-03-31، ويُقاس بالمنشور من المخطط</li><li><b>ج.</b> خفض وسيط الأيام في طلبات المعلومات إلى 15 يومًا قبل 2027-03-31</li><li><b>د.</b> مكتب الإتاحة ينشر المجموعتين الباقيتين، ويُقاس ذلك بعدد التنزيلات</li></ul></li>
</ol>
